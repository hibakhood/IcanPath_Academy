name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Authorization and security suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eduleb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            eduleb/package-lock.json
            eduleb/web/package-lock.json
      - run: npm ci
      - name: Secret scan
        run: npm run check:secrets
      - name: Type-check and lint
        run: npm run type-check && npm run lint
      - name: Database migrations
        run: npm run db:test
      - name: Authorization suites
        run: |
          npm run test:security
          npm run test:security-runtime
          npm run test:workflows
          npm run test:remediation
          npm run test:seed
          npm run test:links
          npm run test:domain
          npm run test:admin
          npm run test:learning
          npm run test:ican
          npm run test:real
          npm run test:frontend
      - name: Dependency audit
        run: npm audit --audit-level=high

  web:
    name: Next.js build and audit
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: eduleb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            eduleb/package-lock.json
            eduleb/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - name: Build the Next.js origin
        run: npm run build:web
      - name: Web dependency audit
        run: npm --prefix web audit --audit-level=high
